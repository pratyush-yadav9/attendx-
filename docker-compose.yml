version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: attendx_postgres
    restart: always
    environment:
      POSTGRES_USER: attendx_user
      POSTGRES_PASSWORD: attendx_secure_password
      POSTGRES_DB: attendx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: attendx_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendx_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://attendx_user:attendx_secure_password@postgres:5432/attendx_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: attendx_super_secret_jwt_key_change_in_production_32bytes!
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
