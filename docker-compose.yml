version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: attendx_postgres
    restart: always
    environment:
      POSTGRES_USER: attendx_user
      POSTGRES_PASSWORD: attendx_secure_password
      POSTGRES_DB: attendx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendx_user -d attendx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
